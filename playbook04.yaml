---
- name: Nginx Automatic Remediation
  hosts: all
  become: true
  gather_facts: true

  tasks:

  - name: Show execution environment
    ansible.builtin.debug:
      msg:
      - "Inventory hostname: {{ inventory_hostname }}"
      - "Ansible hostname: {{ ansible_hostname }}"
      - "Python: {{ ansible_python.executable }}"
      - "OS: {{ ansible_distribution }}"
      - "OS version: {{ ansible_distribution_version }}"
      - "Connection: {{ ansible_connection }}"

    - name: Display target host
      ansible.builtin.debug:
        msg: "Checking nginx on {{ inventory_hostname }}"

    - name: Check nginx service
      ansible.builtin.command:
        cmd: systemctl is-active nginx
      register: nginx_status
      changed_when: false
      failed_when: false

    - name: Display current nginx status
      ansible.builtin.debug:
        msg: "Current nginx status: {{ nginx_status.stdout | default('unknown') }}"

    - name: Start nginx if it is stopped
      ansible.builtin.service:
        name: nginx
        state: started
      when: nginx_status.rc != 0
      register: nginx_remediation

    - name: Enable nginx at boot
      ansible.builtin.service:
        name: nginx
        enabled: true

    - name: Verify nginx is running
      ansible.builtin.command:
        cmd: systemctl is-active nginx
      register: nginx_final_status
      changed_when: false

    - name: Fail if nginx is still not running
      ansible.builtin.fail:
        msg: "REMEDIATION FAILED: nginx is still not running."
      when: nginx_final_status.stdout != "active"

    - name: Display final result
      ansible.builtin.debug:
        msg: >-
          Nginx remediation completed successfully.
          Remediation required:
          {{ nginx_remediation.changed | default(false) }}
