---
- name: Read VM filesystem structure
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: Find visible files and directories in home
      ansible.builtin.find:
        paths:
          - /home
          - /opt
          - /var
          - /tmp
        recurse: true
        file_type: file
        excludes:
          - ".*"
      register: filesystem

    - name: Display filesystem structure
      ansible.builtin.debug:
        msg: "{{ item.path }}"
      loop: "{{ filesystem.files }}"
